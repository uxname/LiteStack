# Git hooks for the meta-repo. There is no CI (docs/adr/0001-no-ci-gates-live-in-git-hooks.md),
# so this hook is the only thing that reads the meta-repo's own artefact — the LikeC4
# model — and scans the staged diff for secrets before they land.
#
# Thin on purpose, like the submodules' hooks: the logic lives in npm scripts, so the
# same checks run by hand with `npm run likec4:validate` / `npm run secrets`. The stand's
# own config is not checked here at all — that is a manual step, see scripts/scale-check.sh.
#
# Installed by `npm install` at the meta root (the `prepare` script in package.json),
# which `scripts/setup.sh` already runs — a clone that skipped it has no hook, exactly
# as in `backend/` and `frontend/`.
pre-commit:
  commands:
    likec4:
      # ADR-0003 requires the model to stay valid, and with no CI this hook is the
      # only thing that enforces it. The npm script also fails on "Valid (0 files)":
      # an empty or misplaced model directory validates green and proves nothing.
      run: npm run likec4:validate

    secrets:
      # gitleaks over the staged diff — the commit's own content, which is what a
      # pre-commit gate should check. The submodules do the same on pre-commit and
      # add the history on pre-push; the meta-repo has no pre-push hook, so its
      # full-history sweep stays a manual `gitleaks git .`. Skips itself when gitleaks
      # is missing (ADR-0001 philosophy: no hard requirement).
      run: npm run secrets
